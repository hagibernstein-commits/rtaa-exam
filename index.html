<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2942">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>הכנה למבחן רת"א - כטב"ם קטן וטיסן</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0f2942;--card:#16344f;--ink:#eef4fa;--dim:#a8bdd0;--acc:#2ea3f2;--ok:#2fbf71;--bad:#e5484d;--line:#274a6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:16px}
  .btn-main{background:var(--acc);color:#fff;padding:14px;width:100%;font-weight:600}
  .btn-ghost{background:transparent;color:var(--dim);padding:10px;width:100%;font-size:14px}
  .exam-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;width:100%;color:var(--ink);text-align:right}
  .exam-row .st{font-size:13px;color:var(--dim)}
  .exam-row .done{color:var(--ok);font-weight:600}
  .pill{display:inline-block;background:#0b1f33;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .qtext{font-size:17px;line-height:1.5;margin-bottom:14px}
  .opt{display:block;width:100%;text-align:right;background:#0b1f33;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:15px;line-height:1.45}
  .opt.sel{border-color:var(--acc);background:#123a5c}
  .opt.correct{border-color:var(--ok);background:#0e3b2a}
  .opt.wrong{border-color:var(--bad);background:#42131a}
  .nav{display:flex;gap:10px;margin-top:6px}
  .nav button{flex:1;padding:12px;background:#0b1f33;color:var(--ink);border:1px solid var(--line)}
  .nav button:disabled{opacity:.35}
  .prog{height:6px;background:#0b1f33;border-radius:3px;overflow:hidden;margin:10px 0 14px}
  .prog>div{height:100%;background:var(--acc);transition:width .2s}
  .score-big{font-size:52px;font-weight:700;text-align:center;margin:8px 0}
  .center{text-align:center}
  .exp{background:#0b1f33;border-right:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--dim);line-height:1.5;margin-top:8px}
  .rev-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .mark{font-size:12px;font-weight:700}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  .install-note{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>const EXAMS=[];</script>
<script>EXAMS.push([{"t":"תקנות - מטיס","q":"מהו \"כטב\"ם קטן\" לפי תקנות הטיס (הפעלת כטב\"ם קטן), התשפ\"ד 2024?","o":["כטב\"ם שמסתו בהמראה, כולל כל דבר שהוא נושא וכל דבר שמחובר אליו, קטנה מ-25 קילוגרם","כטב\"ם שמסתו בהמראה היא 250 גרם לכל היותר","כטב\"ם שמסתו בהמראה קטנה מ-150 קילוגרם","כל כלי טיס בלתי מאויש ללא קשר למשקלו"],"a":0,"e":"ההגדרה בתקנות: כטב\"ם קטן הוא כטב\"ם שמסתו בהמראה, כולל מה שהוא נושא ומה שמחובר אליו, קטנה מ-25 ק\"ג. 250 גרם זה כטב\"ם זעיר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 3","id":1},{"t":"תקנות - מטיסן","q":"מהו \"טיסן זעיר\" לפי ההגדרה בתקנות?","o":["טיסן שמסתו בהמראה קטנה מ-25 ק\"ג","טיסן שמסתו בהמראה, כולל כל דבר שהוא נושא ומחובר אליו, היא 250 גרם לכל היותר","טיסן המשמש לספורט ופנאי בלבד","טיסן שאינו דורש רישיון מטיסן"],"a":1,"e":"טיסן זעיר מוגדר לפי משקל: עד 250 גרם בהמראה כולל כל מה שהוא נושא או מחובר אליו.","ref":"מצגת רישיון מטיסן - עמוד 3","id":2},{"t":"תקנות - מטיס","q":"מה הגיל המינימלי לקבלת רישיון מטיס (הפעלה מסחרית של כטב\"ם קטן)?","o":["12 שנים","14 שנים","16 שנים","18 שנים"],"a":2,"e":"תנאי לקבלת רישיון מטיס הוא שמלאו למבקש 16 שנים (לעומת רישיון מטיסן שמספיק בו גיל 12).","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 7","id":3},{"t":"תקנות - מטיסן","q":"מה הגיל המינימלי לקבלת רישיון מטיסן?","o":["16 שנים","18 שנים","10 שנים","12 שנים"],"a":3,"e":"לפי התקנות, תנאי לקבלת רישיון מטיסן הוא שמלאו למבקש 12 שנים, בנוסף לשליטה בעברית או באנגלית ומעבר מבחן ידע מקצועי.","ref":"מצגת רישיון מטיסן - עמוד 6","id":4},{"t":"מטאורולוגיה","q":"מהי \"גזירת רוח\" (Wind Shear)?","o":["רוח הנושבת בזווית של 90 מעלות לכיוון הטיסה","רוח קבועה הנושבת מכיוון אחד לאורך זמן","שינוי של מהירות ו/או כיוון רוח בכיוון אנכי או אופקי (או שניהם) בקצב מהיר","ירידה הדרגתית בצפיפות האוויר עם הגובה"],"a":2,"e":"גזירת רוח היא שינוי מהיר של מהירות או כיוון הרוח, אנכית או אופקית, ומהווה סכנה משמעותית לטיסה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":15},{"t":"טכני","q":"איזו תופעה אפשרית ברבי להב רבים כאשר אין קליטת GPS, לפי המצגת?","o":["אובדן מיידי של כל החשמל","ייתכן שהגובה והאיזון יישמרו, אך יהיה קושי לשמור על המיקום במרחב","כל רחפן יחזור הביתה באופן בטוח","המשקל בהמראה קטן"],"a":1,"e":"לפי המצגת, ברבי להב רבים הגובה ומצב הטיסה נשמרים ללא GPS, אך שמירת המיקום נפגעת. יש ללמוד את התנהגות הדגם מהוראות היצרן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 20","id":16},{"t":"תקנות - מטיס","q":"איזה מהבאים נכון לגבי רישום כטב\"ם במערכת הבחינה והרישום של רת\"א?","o":["נדרש לרשום כל כטב\"ם, לרבות כטב\"ם זעיר","נדרש לרשום רק כטב\"ם מעל 250 גרם","נדרש לרשום רק כטב\"ם מעל 25 ק\"ג","רישום נדרש רק להפעלה מסחרית בלילה"],"a":0,"e":"בניגוד לטיסן (שם טיסן זעיר פטור), בתקנות כטב\"ם קטן נדרש לרשום כל כטב\"ם לרבות כטב\"ם זעיר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 8","id":5},{"t":"תקנות - מטיסן","q":"איזה טיסן פטור מחובת הרישום במערכת הבחינה והרישום של רת\"א?","o":["טיסן גדול","טיסן זעיר","טיסן כנף קבועה","כל טיסן חייב ברישום"],"a":1,"e":"בתקנות הטיסן נדרש לרשום כל טיסן למעט טיסן זעיר (עד 250 גרם).","ref":"מצגת רישיון מטיסן - עמוד 7","id":6},{"t":"תקנות - מטיס","q":"למשך כמה זמן תקף רישום של כטב\"ם, ומה ניתן לבקש בתום התקופה?","o":["הרישום תקף לצמיתות","שנתיים, וניתן להאריך בשנתיים נוספות","4 שנים, ובעלים רשום רשאי לבקש הארכה לתקופות נוספות של 4 שנים","10 שנים ללא אפשרות הארכה"],"a":2,"e":"הרישום תקף ל-4 שנים, והבעלים הרשום רשאי לבקש להאריך את תוקפו לתקופות נוספות של 4 שנים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 8","id":7},{"t":"טכני","q":"מהי הדרך הנכונה ביותר לפעול ברוב המקרים של אובדן GPS בטיסה?","o":["להטיס בקשר עין עד לנחיתה במקום בטוח","לכבות את בקר הטיסה ולהדליקו מחדש","להפעיל מיד חזרה אוטומטית הביתה (RTH)","להמשיך בטיסה האוטומטית כי המערכת תתאושש"],"a":0,"e":"באובדן GPS הדרך הנכונה היא הטסה בקשר עין עד נחיתה במקום בטוח. אופנים אוטומטיים מבוססי מיקום עלולים לגרום לאובדן הכטב\"ם או לנחיתה לא נשלטת.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 20","id":17},{"t":"תקנות - מטיסן","q":"באיזה פרק זמן חייבים להודיע לרת\"א על שינוי או אירוע כגון שהטיסן נהרס, נגנב, נמכר או שהבעלים הרשום נפטר?","o":["לא יאוחר מ-30 ימים","לא יאוחר מ-48 שעות","לא יאוחר מ-7 ימים","לא יאוחר מ-14 ימים"],"a":3,"e":"התקנות מחייבים להודיע לרת\"א לא יאוחר מ-14 ימים על כל שינוי או אירוע כזה.","ref":"מצגת רישיון מטיסן - עמוד 7","id":8},{"t":"תקנות - מטיס","q":"באיזו תדירות נדרש מבחן עיוני לרישיון מטיס, ואיך מתבצע המבחן הראשוני?","o":["מבחן ראשוני בכיתת לימוד, ולאחר מכן אחת לשנתיים במערכת הבחינה והרישום","מבחן ראשוני באתר הרישום, ולאחר מכן אחת לשנה","מבחן ראשוני בכיתה, ולאחר מכן אחת ל-4 שנים","מבחן אחד בלבד לכל החיים"],"a":0,"e":"נדרש מבחן עיוני ראשוני בכיתת לימוד, ולאחר מכן חידוש אחת לשנתיים במערכת הבחינה והרישום.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 8","id":9},{"t":"תקנות - מטיס","q":"מהן הדרישות לתאורה של כטב\"ם קטן בהטסה בלילה?","o":["תאורה קבועה לבנה שנראית ל-1 ק\"מ","תאורות מהבהבות דולקות שנראות למרחק של לפחות 5 קילומטרים ומושכות את תשומת הלב לכטב\"ם","תאורת לד חזקה הפונה קרקעה","אין דרישת תאורה בלילה"],"a":1,"e":"בלילה ניתן להטיס רק אם לכטב\"ם תאורות מהבהבות דולקות הנראות לפחות 5 ק\"מ, תוך קשר עין ישיר עם התאורות במשך ההפעלה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 11","id":10},{"t":"תקנות - מטיסן","q":"באילו תנאים ניתן להטיס טיסן בלילה?","o":["רק באזורים לא מאוכלסים","בשום תנאי - אסור להטיס טיסן בלילה","רק אם המטיסן מחזיק גם ברישיון מטיס על בסיס תקנות כטב\"ם קטן, ובכל מקרה לא מעל 50 מטרים","בכל גובה כל עוד יש תאורות מהבהבות"],"a":2,"e":"הטסת טיסן בלילה מותרת רק למי שמחזיק גם רישיון מטיס, ובכל מקרה גובה ההטסה לא יעלה על 50 מטרים.","ref":"מצגת רישיון מטיסן - עמוד 10","id":11},{"t":"תקנות - מטיס","q":"מהו הגובה המרבי המותר להטסת כטב\"ם קטן מעל פני השטח, ללא הרשאה מיוחדת?","o":["120 מטרים","300 רגל","50 מטרים","100 מטרים (או 60 מטרים אם כך נקבע בפמ\"ת לגבי אותו מקום)"],"a":3,"e":"גובה ההטסה של כטב\"ם קטן לא יעלה על 100 מטר מעל פני השטח, אלא אם נקבע בפמ\"ת גובה של 60 מטר לאותו מקום (בהסכמת מי שמפקד חיל האוויר הסמיכו).","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 16","id":12},{"t":"תקנות - מטיסן","q":"מהו הגובה המרבי המותר להטסת טיסן מעל פני השטח?","o":["50 מטרים","100 מטרים","150 מטרים","500 מטרים"],"a":0,"e":"מגבלות כלליות על הפעלת טיסן: גובה ההטסה לא יעלה על 50 מטרים מעל פני השטח.","ref":"מצגת רישיון מטיסן - עמוד 14","id":13},{"t":"תקנות - מטיס","q":"מהי המהירות המרבית ביחס לקרקע המותרת לכטב\"ם קטן?","o":["50 קשר","87 קשר","100 קשר","120 קשר"],"a":1,"e":"מהירות הכטב\"ם ביחס לקרקע לא תעלה על 87 קשר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 16","id":14},{"t":"תקנות - מטיס","q":"מהי ראות הטיסה המינימלית הנדרשת להפעלת כטב\"ם קטן?","o":["2 ק\"מ","3 ק\"מ","5 ק\"מ","1 ק\"מ"],"a":1,"e":"מגבלות כלליות: נדרשת ראות טיסה של 3 ק\"מ לפחות.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 16","id":18},{"t":"תקנות - מטיסן","q":"מהו המרחק המזערי שיש לשמור בין הטיסן לבין ענן במישור האנכי?","o":["50 מטרים","100 מטרים","150 מטרים","250 מטרים"],"a":2,"e":"בין הטיסן לבין ענן יש לשמור מרחק מזערי של 150 מטרים במישור האנכי (אותו כלל חל גם על כטב\"ם קטן).","ref":"מצגת רישיון מטיסן - עמוד 14","id":19},{"t":"תקנות - מטיס","q":"כיצד מבקשים הרשאה להפעלה מיוחדת ומה יש לצרף לפי המצגת?","o":["משטרת התעופה, עם אישור בטחוני בלבד","חיל האוויר בלבד, ללא מסמכים","כל טיסן עם רישיון בתוקף, ללא מסמכים נוספים","מבקש דרך אתר הרישום והבחינה, כולל מילוי ניהול סיכונים"],"a":3,"e":"הרשאה להפעלה מיוחדת מבקשים דרך אתר הרישום והבחינה של רת\"א, ונדרש למלא ניהול סיכונים. פטור מתקנה שלא ברשימה - לפי סעיף 165 לחוק הטיס.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 17","id":20}]);
</script>
<script>EXAMS.push([{"t":"תקנות - מטיס","q":"מהו \"קשר עין ישיר\" לפי ההגדרה בתקנות?","o":["מצב בו המפעיל או הצופה רואה את הכטב\"ם בעצמו (כולל בעזרת עדשות מתקנות) באופן רציף במשך כל ההפעלה, באופן המאפשר לקבוע מיקום, מצב ביחס לאופק, גובה וכיוון טיסה","ראייה חד-פעמית של הכטב\"ם בהמראה","קשר רדיו רציף עם הכטב\"ם","ראיית הכטב\"ם דרך מסך עמדת השליטה בלבד"],"a":0,"e":"קשר עין ישיר מוגדר כראייה עצמית ורציפה של הכטב\"ם (עדשות מתקנות מותרות) המאפשרת לקבוע בכל רגע את מיקומו, מצבו ביחס לאופק, גובהו וכיוונו.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 5","id":21},{"t":"תקנות - מטיסן","q":"מהי \"ראות טיסה\" בלילה לפי ההגדרה?","o":["טווח הראייה של מצלמת הטיסן","המרחק שממנו ניתן לראות עצם בולט לעין מואר","המרחק שממנו ניתן לראות עצם בולט לעין גם אם אינו מואר","מרחק של 3 ק\"מ בדיוק"],"a":1,"e":"ראות טיסה היא המרחק האלכסוני האופקי הממוצע ממקום המפעיל: ביום - עצם בולט לעין גם אם אינו מואר; בלילה - עצם בולט לעין מואר.","ref":"מצגת רישיון מטיסן - עמוד 5","id":22},{"t":"תקנות - מטיס","q":"מהו פמ\"ת ומהו נוטאם (NOTAM)?","o":["שניהם פרסומים צבאיים סודיים","פמ\"ת - מפה מטאורולוגית; נוטאם - הודעת חירום לטייסים בלבד","פמ\"ת - פרסום מידע תעופתי באתר רת\"א; נוטאם - פרסום מידע תעופתי זמני באתר רשות שדות התעופה","פמ\"ת - פרסום זמני; נוטאם - פרסום קבוע"],"a":2,"e":"פמ\"ת הוא פרסום מידע תעופתי המפורסם באתר רשות התעופה האזרחית; נוטאם (Notice to Airmen) הוא פרסום מידע תעופתי זמני באתר רשות שדות התעופה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 5","id":23},{"t":"תקנות - מטיס","q":"מי הוא \"תצפיתן\" לפי תקנות כטב\"ם קטן?","o":["מפקח מטעם רת\"א","טייס משנה המחזיק רישיון מטיס","כל אדם שנמצא באזור ההטסה","אדם שהציב הבעלים הרשום בתפקיד זה כדי לסייע למטיס-המפקד ולמטיס בהפעלת מערכת כטב\"ם קטן"],"a":3,"e":"תצפיתן הוא אדם שהציב הבעלים הרשום בתפקיד זה, כדי לסייע למטיס-המפקד ולמטיס בהפעלת מערכת כטב\"ם קטן לפי התקנות.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 6","id":24},{"t":"תקנות - מטיס","q":"האם ניתן להטיס כטב\"ם קטן ללא רישיון מטיס?","o":["כן, אם ההפעלה היא כללית תחת פיקוחו הישיר של מטיס מפקד בעל רישיון, או במסגרת הרשאה להפעלה חריגה","כן, בגובה מתחת ל-10 מטרים בלבד","כן, בימי חול בלבד","לא, בשום מקרה"],"a":0,"e":"ניתן להטיס ללא רישיון מטיס כשההפעלה כללית ותחת פיקוחו הישיר של מטיס מפקד בעל רישיון, או שאושרה במסגרת הרשאה להפעלה חריגה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 7","id":25},{"t":"מטאורולוגיה","q":"איזה ענן מאופיין במזג אוויר סוער, רוחות חזקות, חתחות וגשם או ברד?","o":["צירוס","קומולונימבוס","אלטוסטראטוס","סטראטוס"],"a":1,"e":"קומולונימבוס הוא ענן סופה: מזג אוויר סוער, רוחות חזקות, חתחות וגשם או ברד. צירוס הוא ענן גבוה שכבתי עם רוח חזקה וזרמי סילון.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":38},{"t":"תקנות - מטיסן","q":"באילו תנאים רשאי בעלים רשום להתיר למי שטרם מלאו לו 12 להטיס טיסן?","o":["באין תנאים - אסור בהחלט","אם המשגיח בן 16 לפחות ובעל רישיון מטיסן, נמצא לא יותר משני מטרים מהמושגח ויכול ליטול שליטה מיידית, סורק את המרחב האווירי ומקיים קשר עין ישיר","אם ההטסה מתבצעת בשטח פרטי בלבד","אם הטיסן הוא טיסן זעיר בלבד"],"a":1,"e":"התנאים: המשגיח מלאו לו 16 והוא בעל רישיון מטיסן, מבטיח שההפעלה לפי התקנות, נמצא עד 2 מטר מהמושגח עם יכולת ליטול שליטה מיידית, סורק את המרחב ומקיים קשר עין ישיר.","ref":"מצגת רישיון מטיסן - עמוד 8","id":26},{"t":"תקנות - מטיס","q":"מה חובתו של בעלים רשום לפני שהוא מרשה לאדם אחר להפעיל את מערכת הכטב\"ם הקטן שלו?","o":["לדרוש פיקדון כספי בלבד","אין חובה - הבעלים חופשי להרשות לכל אחד","לבדוק ולמצוא, עובר להפעלה, שאותו אדם רשאי להפעילה לפי התקנות (רישיון מטיס, לא תחת השפעת אלכוהול או סמים וכדומה)","לקבל אישור מרת\"א בכל פעם"],"a":2,"e":"הבעלים הרשום חייב לבדוק שהמבקש רשאי להפעיל לפי התקנות; ואם נודע לו שמי שקיבל רשות הפעיל שלא לפי התקנות - לא ירשה לו להפעיל או להמשיך בהפעלה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 9","id":27},{"t":"תקנות - מטיסן","q":"מה כוללת בדיקת הכשירות להטסה בטוחה של טיסן לפני ההפעלה?","o":["בדיקת מצלמה בלבד","בדיקת שלמות המעטפת והמדחפים בלבד","בדיקת מערכת הכוח וההנעה בלבד","שלמות המעטפת והמדחפים, מערכת הכוח וההנעה, מערכת החשמל, ועמדת השליטה כולל קישורי תקשורת וקליטה מדויקת של פקודות"],"a":3,"e":"הבדיקה כוללת, בין השאר: שלמות ותקינות המעטפת והמדחפים, מערכת הכוח וההנעה, שלמות מערכת החשמל, ושלמות עמדת השליטה וקישורי התקשורת כולל שהוראות נקלטות ומיושמות במדויק ובמיידי.","ref":"מצגת רישיון מטיסן - עמוד 8","id":28},{"t":"טכני","q":"כיצד מתאפשרת השליטה בתנועה של רחפן (רב להב)?","o":["על ידי שינוי כיוון אנטנת השליטה","באמצעות משטחי הגאים בלבד","על ידי שינויי דחף וכוח של כל רוטור בנפרד ביחס לרוטורים האחרים, כשכל שני מנועים צמודים מסתובבים בכיוונים נגדיים","על ידי הטיית גוף הרחפן בלבד"],"a":2,"e":"השליטה ברחפן מתאפשרת על ידי שינוי דחף כל רוטור בנפרד; כל שני מנועים צמודים מסתובבים בכיוונים נגדיים לקיזוז המומנט.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 20","id":39},{"t":"תקנות - מטיס","q":"מהו המרחק המינימלי שיש לשמור מאירוע כבאות והצלה או תאונת דרכים, ומהו המרחק מאירוע של שירות בתי הסוהר?","o":["5 ק\"מ מאירוע כבאות והצלה או תאונת דרכים, ו-1 ק\"מ מאירוע של שירות בתי הסוהר","2 ק\"מ משניהם","10 ק\"מ משניהם","1 ק\"מ מכבאות ו-5 ק\"מ משב\"ס"],"a":0,"e":"יש להטיס במרחק של לפחות 5 ק\"מ מאירוע כבאות והצלה או תאונת דרכים, ו-1 ק\"מ מאירוע של שירות בתי הסוהר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 10","id":29},{"t":"תקנות - מטיסן","q":"האם מותר להטיס טיסן מכלי רכב בתנועה?","o":["כן, תמיד","לא, אלא אם הטיסן מופעל מעל אזור שאינו אזור מאוכלס","כן, אם הרכב נע לאט","כן, אם נהג אחר מפעיל את הטיסן"],"a":1,"e":"אסור להטיס מכלי טיס או כלי רחיפה מאויש בתנועה; מכלי רכב או כלי שיט בתנועה - רק אם הטיסן מופעל מעל אזור שאינו אזור מאוכלס.","ref":"מצגת רישיון מטיסן - עמוד 9","id":30},{"t":"תקנות - מטיס","q":"מהם התנאים להטסת כטב\"ם קטן בלילה ביחס לתצפיתן ולמרחק?","o":["אין צורך בתצפיתן בלילה","תצפיתן אחד ומרחק בלתי מוגבל","תצפיתן אחד לפחות במשך כל ההפעלה, והכטב\"ם במרחק שלא עולה על 500 מטרים מהמטיס","שני תצפיתנים ומרחק של עד 1 ק\"מ"],"a":2,"e":"הטסת כטב\"ם קטן נעשית בהסתייעות בתצפיתן אחד לפחות במשך כל ההפעלה, והכטב\"ם מוטס במרחק שאינו עולה על 500 מטרים מהמטיס.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 11","id":31},{"t":"תקנות - מטיסן","q":"באילו תנאים ניתן להטיס טיסן בדמדומים?","o":["רק באזורים לא מאוכלסים","רק עם רישיון מטיס","ללא תנאים מיוחדים","רק אם לטיסן תאורות מהבהבות דולקות הנראות לפחות 5 ק\"מ ומושכות תשומת לב, והמפעיל מקיים קשר עין ישיר ורואה את התאורות במשך ההפעלה"],"a":3,"e":"בדמדומים נדרשות תאורות מהבהבות דולקות הנראות למרחק 5 ק\"מ לפחות, וקשר עין ישיר כך שהמפעיל רואה את התאורות במשך ההפעלה.","ref":"מצגת רישיון מטיסן - עמוד 10","id":32},{"t":"תקנות - מטיס","q":"מהם התנאים להטסת כטב\"ם ללא קשר עין של המטיס, בעזרת צופה?","o":["הצופה בן 16 לפחות, מקיימים תקשורת מתמשכת ויעילה ומתאמים סריקת מרחב אווירי וקשר עין","הצופה בן 12 עם אישור הורים","הצופה בן 21 עם רישיון טייס","אין אפשרות להטיס ללא קשר עין"],"a":0,"e":"לפי מצגת המטיס: לצופה מלאו 16 שנים, נדרשת תקשורת מתמשכת ויעילה ותיאום של סריקת המרחב וקשר עין. תנאי הסמיכות המפורש במצגת הטיסן אינו מופיע כאן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 12","id":33},{"t":"תקנות - מטיסן","q":"כמה טיסנים רשאי אדם להפעיל בו-זמנית, ולגבי כמה טיסנים רשאי אדם לשמש צופה באותו זמן?","o":["שניים, אם שניהם באותו שדה ראייה","לא יותר מטיסן אחד באותו זמן, ולא ישמש צופה לגבי יותר מטיסן אחד באותו זמן","שלושה, בתנאי שכל אחד עם צופה נפרד","אין הגבלה"],"a":1,"e":"אסור להפעיל יותר מטיסן אחד בו-זמנית, ואסור לשמש צופה לגבי יותר מטיסן אחד באותו זמן.","ref":"מצגת רישיון מטיסן - עמוד 11","id":34},{"t":"תקנות - מטיס","q":"מהו הכלל לגבי נשיאת חומר מסוכן בכטב\"ם?","o":["מותר בחקלאות ללא הגבלה","מותר באישור רת\"א בלבד","לא יפעיל אדם כטב\"ם הנושא חומר מסוכן","מותר עד 1 ק\"ג"],"a":2,"e":"איסור גורף: לא יפעיל אדם כטב\"ם הנושא חומר מסוכן (בחקלאות קיימת הסדרה ייעודית בתקנות ובהרשאה מתאימה).","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 13","id":35},{"t":"תקנות - מטיסן","q":"מהי זכות הקדימה בין טיסן לכלי טיס מאויש?","o":["לכבד יותר זכות קדימה","זכות קדימה שווה לשניהם","לטיסן זכות קדימה תמיד","מפעיל הטיסן ייתן זכות קדימה לכל כלי טיס מאויש ולכל כלי רחיפה מאויש, יפנה את המרחב סביבו ויימנע ממעבר מעל, מתחת או לפניו, אלא באופן בטוח"],"a":3,"e":"מי שמפעיל טיסן חייב לתת זכות קדימה לכל כלי טיס ורחיפה מאוישים, לפנות את המרחב האווירי סביבם ולהימנע ממעבר מעל, מתחת או לפניהם, אלא אם ניתן לעשות זאת בבטחה.","ref":"מצגת רישיון מטיסן - עמוד 11","id":36},{"t":"תקנות - מטיס","q":"נוכחת שאתה מפעיל כטב\"ם בקרבה לכלי טיס אחר בסיכון התנגשות. מה עליך לעשות?","o":["להנחית את הכטב\"ם מידית, ולא לחדש את ההפעלה עד שכלי הטיס עזב את המרחב, נבדק המידע בפמ\"ת ובנוטאם ונסקר המרחב בשנית","להמשיך בזהירות מוגברת","לשדר למגדל הפיקוח ולהמתין","להעפיל מעליו מיד"],"a":0,"e":"יש להנחית מידית. חידוש ההפעלה מותנה בכך שכלי הטיס עזב את המרחב, המידע בפמ\"ת ובנוטאם נבדק, והמרחב האווירי נסקר בשנית.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 13","id":37},{"t":"תקנות - מטיס","q":"מהי \"תאונת טיס\" לפי חוק הטיס תשע\"א 2011?","o":["רק אירוע עם נפגעי נפש","כל נחיתה קשה","כל נזק קל לכטב\"ם","אירוע הקשור בהפעלת כלי טיס או בפעולות בדק, שבמהלכו אדם נהרג או נפצע חמור, נגרם לכלי הטיס נזק חמור או מבני, או שכלי הטיס נעדר או שלא ניתן להגיע אליו"],"a":3,"e":"תאונת טיס מוגדרת בחוק הטיס: מוות או פציעה חמורה של אדם, נזק חמור או מבני לכלי הטיס, או כלי טיס שנעדר או שלא ניתן להגיע אליו.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 18","id":40}]);
</script>
<script>EXAMS.push([{"t":"תקנות - מטיס","q":"מהו \"אזור אסור לטיסה\"?","o":["מרחב אוויר בעל ממדים מוגדרים, כפי שפורסם בפמ\"ת, שבו טיסת כלי טיס אסורה","אזור שבו יש סכנה זמנית בלבד","כל שטח צבאי","אזור שבו הטיסה מותרת רק באישור מוקדם"],"a":0,"e":"אזור אסור לטיסה הוא מרחב אוויר בעל ממדים מוגדרים שפורסם בפמ\"ת, שבו טיסת כלי טיס אסורה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 4","id":41},{"t":"תקנות - מטיסן","q":"מהו \"אזור מאוכלס\" לפי ההגדרה?","o":["כל שטח פתוח בין יישובים","מתחם בשטח יישוב, המשמש בעיקר למטרות מגורים, תעשייה, מסחר או פנאי","רק מרכזי קניות","כל שטח שיש בו אנשים מעת לעת"],"a":1,"e":"אזור מאוכלס הוא מתחם בשטח יישוב המשמש בעיקר למגורים, תעשייה, מסחר או פנאי.","ref":"מצגת רישיון מטיסן - עמוד 4","id":42},{"t":"תקנות - מטיס","q":"איזו דרישה חלה על כטב\"ם זעיר בהפעלה מעל אדם או תשתית, לפי המצגת?","o":["הוא חייב להיות כנף קבועה","מספיק שמותקנת בו מצלמה","אין בו חלקים נעים גלויים שעלולים לגרום נזק בהתנגשות","הוא חייב לשקול מעל 250 גרם"],"a":2,"e":"במצגת נדרש שלא יהיו בכטב\"ם הזעיר חלקים נעים גלויים העלולים לגרום נזק בהתנגשות. קיימים גם תנאים נוספים, לרבות איסור שהייה מעל אדם בשטח פתוח או כלי רכב בתנועה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 14","id":43},{"t":"מטאורולוגיה","q":"איזה ענן הוא ענן גשם המתאפיין בגשם קל וממושך ואוויר יציב?","o":["אלטוסטראטוס","קומולוס","נימבוסטרטוס","צירוס"],"a":2,"e":"נימבוסטרטוס הוא ענן גשם עם גשם קל וממושך ואוויר יציב. אלטוסטראטוס הוא ענן שכבתי בינוני שבדרך כלל לא מוריד גשם; סטראטוס עלול ליצור טפטוף.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":55},{"t":"טכני","q":"מה יקרה בדרך כלל לרחפן (רב להב) אם אחד מארבעת הרוטורים יפסיק לעבוד?","o":["הרחפן ינחת אוטומטית במקום","הרחפן יתקן את עצמו מיידית","הרחפן ימשיך לטוס כרגיל על שלושה רוטורים","הרחפן יהיה בלתי נשלט וככל הנראה יתרסק במהירות ובצורה בלתי נשלטת"],"a":3,"e":"ברוב רבי הלהב 4 רוטורים; אובדן רוטור אחד הורס את איזון הדחף והמומנטים, והרחפן הופך בלתי נשלט ומתרסק. לכן חשובה תקינות הרוטורים והפעלה מעל אזור בטוח.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 20","id":56},{"t":"טכני","q":"מה נכון לגבי הרכבת רוטורים ברחפן?","o":["למרות שהרוטורים זהים בדרך כלל בגודלם ובצורתם, יש הבדלים במיקום זווית ההתקפה ולכן יש משמעות למיקום הרכבתם - יש להשתמש בסימונים על הרוטורים ובהוראות היצרן","יש להרכיב רוטורים הפוכים בכל פעם אחרת","מיקום ההרכבה לא משנה","כל הרוטורים זהים וניתן להרכיב בכל מיקום"],"a":0,"e":"יש הבדלים בזווית ההתקפה בין הרוטורים, ולכן מיקום ההרכבה משמעותי; ברוב הכטב\"מים יש סימון על הרוטורים ויש לפעול לפי הוראות היצרן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 20","id":57},{"t":"תקנות - מטיסן","q":"מהו המרחק המינימלי שיש לשמור בין טיסן לבין אדם שאינו משתתף ישירות בהפעלה, ומהו הכלל לגבי תשתית?","o":["100 מטר מאדם ו-200 מטר מתשתית","אין מגבלות","30 מטר מאדם ו-50 מטר מתשתית","לפחות 50 מטר מאדם; אין להטיס במרחק הקטן מ-150 מטר מתשתית אלא אם היא בבעלותו/חזקתו של המפעיל או בהסכמת הבעלים או המחזיק"],"a":3,"e":"בתקנות הטיסן: לפחות 50 מטר מאדם שאינו משתתף ישירות; אין להטיס מעל תשתית, ומרחק מינימלי של 150 מטר מתשתית אלא בבעלות/חזקה/הסכמה.","ref":"מצגת רישיון מטיסן - עמוד 12","id":44},{"t":"תקנות - מטיס","q":"מה נכלל ב\"שהייה\" מעל אדם בשטח פתוח, לפי מצגת הכטב\"ם הקטן?","o":["ריחוף, טיסה חוזרת או טיסה במעגלים מעליו","רק נחיתה ליד האדם","כל טיסה במרחק של קילומטר","רק טיסה מעבר לגובה 100 מטר"],"a":0,"e":"המצגת מגדירה שהייה כלרבות ריחוף, טיסה חוזרת או במעגלים. מעבר קצר וחד-פעמי מעל אדם בשטח פתוח לצורך טיסה מנקודה לנקודה מוחרג מהגדרת שהייה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 14","id":45},{"t":"תקנות - מטיסן","q":"מה מותר בהטסת \"טיסן זעיר\" מעל אדם או תשתית?","o":["אסור בהחלט","מותר בתנאי שאין בטיסן חלקים נעים גלויים שעלולים לגרום נזק בהתנגשות, והטיסן לא שוהה מעל אדם בשטח פתוח או מעל כלי רכב בתנועה (מעבר קצר וחד-פעמי לצורך טיסה מנקודה לנקודה אינו נחשב שהייה)","מותר רק מעל בני משפחה","מותר בגובה מעל 50 מטר בלבד"],"a":1,"e":"טיסן זעיר: מותר מעל אדם או תשתית בתנאי שאין חלקים נעים גלויים מסכנים, ואין שהייה (מרחף, טיסה חוזרת או במעגלים) מעל אדם בשטח פתוח או כלי רכב בתנועה, למעט מעבר קצר וחד-פעמי.","ref":"מצגת רישיון מטיסן - עמוד 12","id":46},{"t":"מטאורולוגיה","q":"מהי צירוס?","o":["ענן גשם נמוך","ענן גבוה שכבתי המלווה ברוח חזקה וזרמי סילון","ענן קרקעי בבוקר","ענן סופה עם ברקים"],"a":1,"e":"צירוס הוא ענן גבוה שכבתי המלווה ברוח חזקה וזרמי סילון.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":58},{"t":"תקנות - מטיס","q":"האם מותר להטיס כטב\"ם קטן באזור פיקוח, באזור פיקוח שדה או באזור שדה?","o":["כן, עד גובה 30 מטר","כן, בגובה נמוך","לא ניתן להטיס באזורים אלה, אלא אם ההטסה אושרה מראש בידי יחידת הנת\"א המתאימה או כפי שנקבע בפמ\"ת","כן, בימי חול בלבד"],"a":2,"e":"אין להטיס באזור פיקוח, אזור פיקוח שדה או אזור שדה; אם ההטסה אושרה מראש על ידי יחידת הנת\"א המתאימה או נקבע אחרת בפמ\"ת - ניתן להטיס על בסיס האישור.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 15","id":47},{"t":"תקנות - מטיס","q":"מהו המרחק המינימלי ממסלול שדה תעופה אזרחי או מנחת, ומהו המרחק משדה צבאי?","o":["5 ק\"מ ו-10 ק\"מ","500 מטר משניהם","1 ק\"מ ו-2 ק\"מ","2 ק\"מ ממסלול שדה תעופה או מסלול מנחת, ו-3 ק\"מ משדה צבאי"],"a":3,"e":"בתקנות כטב\"ם קטן: אין להטיס בתחום שמרחקו מכל נקודה על מסלול שדה תעופה או מסלול מנחת פחות מ-2 ק\"מ, ומשדה צבאי במרחק הקטן מ-3 ק\"מ (אלא אם נקבע אחרת או אושר מראש).","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 15","id":48},{"t":"תקנות - מטיסן","q":"בתקנות הטיסן - מה המרחק המינימלי ממסלול שדה תעופה, ומה המגבלה באזור אימונים של מטוס זעיר?","o":["לא פחות מ-2 ק\"מ מכל נקודה על מסלול שדה תעופה או מנחת (או כפי שנקבע בפמ\"ת); ביום - לא פחות מ-500 מטר מתחום אזור אימונים המיועד למטוס זעיר","1 ק\"מ ממסלול ו-1 ק\"מ מאזור אימונים","אין מגבלות","5 ק\"מ ממסלול; אין מגבלה באזור אימונים"],"a":0,"e":"טיסן: 2 ק\"מ ממסלול שדה תעופה/מנחת (או מרחק גדול יותר אם נקבע בפמ\"ת), וביום אין להטיס במרחק הקטן מ-500 מטר מאזור אימונים של מטוס זעיר לפי הפמ\"ת.","ref":"מצגת רישיון מטיסן - עמוד 13","id":49},{"t":"תקנות - מטיס","q":"אילו מהתקנות הבאות ניתן לבקש הרשאה להפעלה מיוחדת? (נכון אחד)","o":["חובת הרישום במערכת רת\"א","תקנה 27 - הפעלה בקשר עין ישיר","איסור נשיאת חומר מסוכן מחוץ לחקלאות","חובת המבחן העיוני"],"a":1,"e":"ברשימת התקנות שמהן ניתן לבקש הרשאה: תקנה 2(ב) רישיון, תקנה 25 הטסה מכלי בתנועה, תקנה 26(ג)(4) מרחק 500 מטר, תקנה 27 קשר עין ישיר, תקנה 28 תצפיתן, תקנה 29 מספר כטב\"מים בו-זמנית, תקנה 30 חומר מסוכן בחקלאות, תקנה 32 הפעלה מעל אדם או תשתית, תקנה 35 מגבלות כלליות.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 17","id":50},{"t":"תקנות - מטיסן","q":"מהי \"הפעלת טיסן בחריגה\" לפי ההגדרה?","o":["הפעלה ללא רישיון","הפעלה בניגוד לחוק הטיס בלבד","הפעלה שלא לפי התקנות הספציפיות המפורטות בתקנות, או הפעלת טיסן גדול","הפעלה של טיסן זעיר בלבד"],"a":2,"e":"הפעלת טיסן בחריגה היא הפעלה שלא לפי התקנות הספציפיות (למשל הטסה ללא קשר עין) ו/או כשהטיסן הוא טיסן גדול (מעל 25 ק\"ג).","ref":"מצגת רישיון מטיסן - עמוד 4","id":51},{"t":"תקנות - מטיס","q":"מהם תנאי ההפרדות המופחתות (סעיף 5(ג) בפמ\"ת) מכלי טיס וכלי רחיפה?","o":["הפרדה אנכית של 500 רגל ורוחבית של 1 ק\"מ","אין צורך בהפרדה","הפרדה אנכית של 100 רגל ורוחבית של 100 מטר","הפרדה אנכית שלא תקטן מ-200 רגל, והפרדה רוחבית ואורכית שלא תקטן מ-250 מטר"],"a":3,"e":"בהפרדות מופחתות: הפרדה אנכית לא תקטן מ-200 רגל, והפרדה רוחבית ואורכית לא תקטן מ-250 מטר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 19","id":52},{"t":"תקנות - מטיס","q":"מהם התנאים הנוספים לטיסה בהפרדות מופחתות לפי הפמ\"ת?","o":["קשר עין רצוף בין המטיס המפקד או התצפיתן לכטב\"ם; הכטב\"ם בגובה של עד 300 רגל מעל פני השטח; מהירות שלא תעלה על 87 קשר","טיסה בלילה בלבד עם תאורה","אין תנאים נוספים","גובה עד 500 רגל ומהירות עד 100 קשר"],"a":0,"e":"תנאים נוספים: קשר עין רצוף, גובה עד 300 רגל מעל פני השטח, מהירות שלא תעלה על 87 קשר; האחריות על ההפרדה היא על מטיס הכטב\"ם.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 19","id":53},{"t":"תקנות - מטיסן","q":"מה אומר חוק הטיס תשע\"א 2011 על מקרה חירום?","o":["אסור לסטות משום הוראת דין בשום מקרה","במקרה חירום המצריך לדעת המטיס המפקד, יש לבצע פעולה מידית לשם הגנה על חיי אדם או שמירת הבטיחות, גם אם זה יגרור סטייה מהוראת כל דין","יש להמתין לאישור מהמגדל בכל מקרה","רק טייס מסחרי רשאי לסטות מהוראות"],"a":1,"e":"במקרה חירום המצריך לדעת המטיס המפקד - פעולה מידית להגנה על חיי אדם או שמירת הבטיחות, גם במחיר סטייה מהוראת כל דין.","ref":"מצגת רישיון מטיסן - עמוד 15","id":54},{"t":"תקנות - מטיסן","q":"מהו המרחק המרבי המותר בין מפעיל הטיסן לבין הטיסן?","o":["אין הגבלה כל עוד יש קשר רדיו","1 ק\"מ","המרחק קטן ומאפשר הטסה בקשר עין ישיר, ובכל מקרה לא יותר מ-500 מטרים","3 ק\"מ"],"a":2,"e":"המרחק בין המפעיל לטיסן יהיה כזה שמאפשר קשר עין ישיר, ובכל מקרה לא יותר מ-500 מטרים.","ref":"מצגת רישיון מטיסן - עמוד 14","id":59},{"t":"תקנות - מטיס","q":"מה מותר ומה אסור בהשלכה או ריסוס מכטב\"ם?","o":["אסור רק ריסוס כימי","מותר הכל באזורים לא מאוכלסים","מותר להשליך חפצים קלים בלבד","לא ישליך אדם חפץ מכטב\"ם ולא ירסס חומר מכטב\"ם אם יש בכך כדי לסכן חיים או רכוש של אחר; הפעלה בחקלאות מותרת לפי תקנות ההפעלה הרלוונטיות"],"a":3,"e":"איסור על השלכה או ריסוס המסכנים חיים או רכוש; בחקלאות ניתן להפעיל לפי תקנות ההפעלה הרלוונטיות המופרטות בתקנות.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 10","id":60}]);
</script>
<script>EXAMS.push([{"t":"תקנות - מטיס","q":"מהם תנאי הזכאות לרישיון מטיס, מעבר לגיל?","o":["קורא, מדבר ומבין עברית ואת האנגלית הטכנית המקובלת בתעופה, ובעל ידע מקצועי שהוכח במעבר מבחן באתר הבחינה והרישום של רת\"א","תואר בהנדסת אווירונאוטיקה","רישיון נהיגה בתוקף","רק תעודת זהות בתוקף"],"a":0,"e":"תנאים: גיל 16, שליטה בעברית ובאנגלית טכנית תעופתית, וידע מקצועי שהוכח במבחן באתר הבחינה והרישום של רת\"א.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 7","id":61},{"t":"מטאורולוגיה","q":"איך משפיעה צפיפות האוויר על העילוי?","o":["צפיפות משפיעה רק על מנועים","אין השפעה","עלייה בצפיפות האוויר (למשל עם ירידה בגובה) תעלה את העילוי; ירידה בצפיפות (למשל עם עלייה בגובה) תוריד את העילוי","צפיפות גבוהה מורידה עילוי תמיד"],"a":2,"e":"צפיפות אוויר גבוהה יותר = יותר עילוי. עלייה בגובה מורידה את הצפיפות ולכן מורידה את העילוי.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":71},{"t":"תקנות - מטיסן","q":"באילו מקרים רשאי המנהל לסרב לתת רישיון מטיסן, ולכמה זמן?","o":["אין סמכות סירוב","אם המבקש מסר מידע כוזב או שגוי, או שהוא עלול להפעיל טיסן באופן המסכן חיים או רכוש של מי שאינו משתתף ישירות - לתקופה שלא תעלה על שנה מיום הגשת הבקשה","רק בעבירות פליליות, ל-5 שנים","לצמיתות בכל מקרה"],"a":1,"e":"המנהל רשאי לסרב לתקופה שלא תעלה על שנה מיום הגשת הבקשה אם נמסר מידע כוזב או שגוי, או שהמבקש עלול להפעיל באופן מסכן.","ref":"מצגת רישיון מטיסן - עמוד 6","id":62},{"t":"מטאורולוגיה","q":"מה נכון לגבי הטסה בגשם?","o":["גשם מותר עד 10 מ\"מ תמיד","גשם משפר את קירור המנועים ולכן מומלץ","גשם לא משפיע על כטב\"ם","יש להטיס לפי הוראות היצרן, וככלל להימנע מהטסה בגשם; לרוב לא ניתן לאמוד את כמות המילימטרים ויצרנים רושמים מגבלות - גשם יכול לגרום לאובדן שליטה"],"a":3,"e":"הגשם עלול לגרום לאובדן שליטה; יש לפעול לפי מגבלות היצרן ולהימנע מהטסה בגשם.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":72},{"t":"תקנות - מטיס","q":"מהן ההוראות לעניין סימון כטב\"ם?","o":["ציור בצבע בולט בלבד","מדבקה זמנית בלבד","קביעת סימני הזיהוי על משטח חיצוני של גוף הכטב\"ם, גלויים לעין וקריאים למי שאוחז בכטב\"ם, ובאופן שיבטיח שיישארו קבועים במהלך כל הטיסה","סימון פנימי בתא הסוללה"],"a":2,"e":"הסימנים יקבעו על משטח חיצוני של גוף הכטב\"ם, יהיו גלויים וקריאים למי שאוחז בו, ויישארו קבועים במהלך כל הטיסה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 8","id":63},{"t":"מטאורולוגיה","q":"איך משפיעה טמפרטורה קיצונית על הסוללה?","o":["טמפרטורה קיצונית יכולה לגרום נזק לסוללה (בעיקר טמפרטורה גבוהה) ולירידה בביצועים (בעיקר בטמפרטורה נמוכה)","קור בלבד פוגע","חום תמיד משפר ביצועים","אין השפעה"],"a":0,"e":"חום קיצוני עלול לגרום נזק לסוללה; קור קיצוני גורם בעיקר לירידה בביצועים. יש להטיס לפי מגבלות היצרן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":73},{"t":"תקנות - מטיסן","q":"אילו פרטים נדרשים בעת רישום טיסן?","o":["מספר רישיון מטיסן בלבד","צילום הטיסן בלבד","רק שם הבעלים וכתובת","פרטי היצרן, דגם, מספר מזהה שנתן היצרן (אם קיים) או מספר סידורי של בקר הטיסה"],"a":3,"e":"ברישום נדרשים: פרטי יצרן, דגם, מספר מזהה שנתן היצרן אם קיים, או מספר סידורי של בקר הטיסה.","ref":"מצגת רישיון מטיסן - עמוד 7","id":64},{"t":"טכני","q":"מהו מנוע ארבע פעימות ומהן הפעולות במחזור העבודה?","o":["מנוע חשמלי עם ארבע סוללות","מנוע בעירה פנימית: יניקה (כניסת תערובת בנזין ואוויר), דחיסה (נפח קטן, לחץ וטמפרטורה עולים והצתה), עבודה (פיצוץ הופך לאנרגיה קינטית המסובבת את הציר), פליטה (פליטת גזים שרופים דרך המפלט)","מנוע סילון עם ארבעה שלבים","מנוע עם ארבעה מצתים"],"a":1,"e":"ארבע הפעימות: יניקה, דחיסה, עבודה, פליטה - כך מנוע בוער פנימי ממיר את אנרגיית התערובת לתנועה סיבובית של ציר המנוע.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 23","id":74},{"t":"טכני","q":"מה נדרש לחישוב המהירות האווירית של כטב\"ם, ומה קורה כשהפתח הסטטי חסום?","o":["לחץ אטמוספרי בלבד; המהירות תראה אפס","רק לחץ סטטי; לא קורה דבר","נדרש לחץ דינאמי שהוא ההפרש בין הלחץ הטוטאלי ללחץ הסטטי (נמדד בחרירי צינור הפיטו); כשהפתח הסטטי חסום - בעת נסיקה המהירות המוצגת תרד ובעת הנמכה תעלה","רק מד GPS; המהירות תקפא"],"a":2,"e":"מהירות אווירית מחושבת מהלחץ הדינאמי (טוטאלי פחות סטטי) דרך צינור הפיטו. פתח סטטי חסום: בנסיקה המהירות המוצגת יורדת, ובהנמכה עולה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 23","id":75},{"t":"תקנות - מטיס","q":"מהו הכלל בדבר כשירות בריאותית ואלכוהול וסמים בהפעלת כטב\"ם?","o":["לא יפעיל אדם כטב\"ם, לא ישמש צופה ולא ישתתף ישירות בהפעלה אם הוא במצב גופני או נפשי שעלול לפגוע בהפעלה הבטוחה; ואיסור מוחלט על הפעלה תחת השפעת אלכוהול או כשמצוי בגופו סם מסוכן או תוצר חילוף חומרים שלו","איסור על סמים בלבד","אין הנחיות בריאותיות","מותר אלכוהול בכמות קטנה"],"a":0,"e":"איסור כפול: מצב גופני או נפשי הפוגע בבטיחות, ושתייה/השפעת אלכוהול או נוכחות סם מסוכן בגוף - גם למפעיל וגם לצופה ולמשתתף ישיר.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 10","id":65},{"t":"תקנות - מטיסן","q":"מהו הכלל לגבי הפעלת טיסן מכלי טיס או כלי רחיפה מאויש?","o":["מותר בגובה נמוך","אסור להטיס מכלי טיס או מכלי רחיפה מאויש בתנועה","מותר עם אישור הטייס","מותר בלילה בלבד"],"a":1,"e":"אין להטיס מכלי טיס או מכלי רחיפה מאויש בתנועה; מכלי רכב או שיט בתנועה - רק מעל אזור לא מאוכלס.","ref":"מצגת רישיון מטיסן - עמוד 9","id":66},{"t":"טכני","q":"מה מראה מד הגובה בכיוון QNH, לפי המצגת?","o":["גובה ביחס לנקודת ההמראה בלבד","מהירות קרקעית","טמפרטורת האוויר","גובה ביחס לפני הים"],"a":3,"e":"המצגת מציינת כי QNH הוא לחץ ברומטרי מקומי יחסית לפני הים, ומד הגובה יראה גובה ביחס לפני הים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 24","id":76},{"t":"תקנות - מטיס","q":"מהם התנאים לגבי אזור ההטסה בהפעלת כטב\"ם קטן בלילה?","o":["טיסה מעל גג בלבד","אין תנאים מיוחדים","האזור מואר באופן שמאפשר למטיס ולתצפיתן לזהות אנשים או מכשולים, ובוצע סיור באור יום לפני ההטסה ונסקרו מפגעי בטיחות ומכשולים באזור","רק אישור שכנים"],"a":2,"e":"בלילה: האזור מואר כך שאפשר לזהות אנשים ומכשולים, ובוצע סיור באור יום מראש שבו נסקרו מפגעי בטיחות ומכשולים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 11","id":67},{"t":"תקנות - מטיס","q":"איזו יכולת של המערכת נדרשת לפי רשימת התנאים להפעלת כטב\"ם קטן בלילה?","o":["הקלטת קול","שליטה מרחוק של רת\"א","שידור וידאו חי","הנחתה של הכטב\"ם הקטן או החזרתו לאתר שממנו המריא, באופן מידי ואוטומטי בידי המטיס"],"a":3,"e":"ברשימת תנאי ההפעלה בלילה מופיעה יכולת להנחית את הכטב\"ם או להחזירו לאתר ההמראה באופן מידי ואוטומטי בידי המטיס.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 11","id":68},{"t":"טכני","q":"מהו מרכז הכובד ולמה הוא חשוב לפי המצגת?","o":["הנקודה הגבוהה ביותר בכנף","הנקודה הממוצעת של מסת הכטב\"ם, החשובה להערכת ביצועים ויציבות","מיקום אנטנת ה-GPS בלבד","הגובה המרבי המותר בתקנות"],"a":1,"e":"המצגת מגדירה מרכז כובד כנקודה הממוצעת של מסת הכטב\"ם, ומציינת את חשיבותו להערכת הביצועים והיציבות בטיסה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 24","id":77},{"t":"תקנות - מטיסן","q":"מי רשאי לשמש צופה שבעזרתו מטיסים טיסן ללא קשר עין של המפעיל, ומה נדרש בין השניים?","o":["צופה בן 16 לפחות; הם נמצאים בסמוך זה לזה עם אותו שדה ראייה, מקיימים תקשורת מתמשכת ויעילה, ומתאמים באופן מתמשך סריקת מרחב אווירי וקשר עין עם הטיסן","רק בעל רישיון מטיס","רק בן משפחה של המפעיל","כל אדם מעל גיל 10"],"a":0,"e":"צופה: בן 16 לפחות, סמוך למפעיל עם אותו שדה ראייה, תקשורת מתמשכת ויעילה ביניהם, ותיאום מתמשך של סריקת מפגעים וקשר עין עם הטיסן.","ref":"מצגת רישיון מטיסן - עמוד 10","id":69},{"t":"תקנות - מטיס","q":"מהו הכלל על הפעלת מספר כטב\"מים קטנים בו-זמנית?","o":["לאדם אחד מותר להפעיל שני כלים אם יש תצפיתן","לא ישמש אדם בתפקיד מטיס-מפקד, מטיס או תצפיתן לגבי יותר מכטב\"ם קטן אחד באותו זמן, בין באותו תפקיד ובין בתפקידים שונים","מותר עד שלושה","אין הגבלה"],"a":1,"e":"אדם לא ישמש באף תפקיד (מטיס-מפקד, מטיס או תצפיתן) לגבי יותר מכטב\"ם קטן אחד בו-זמנית, גם לא בשילוב תפקידים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 12","id":70},{"t":"טכני","q":"מה נכון לגבי סוללות בכטב\"ם?","o":["סוללה שהתנפחה ניתן להמשיך להשתמש בה בזהירות","הסוללות רגישות לטמפרטורות, נפילות וקרעים ויש לטפל בהן בעדינות ולבדוק שלמות לפני כל המראה; סוללה שהתנפחה - אין להשתמש בה יותר","סוללות לא דורשות בדיקה","יש לטעון סוללות ל-100% תמיד לפני אחסון ארוך"],"a":1,"e":"סוללות רגישות לטמפרטורות, נפילות וקרעים; בודקים שלמות לפני כל המראה, וסוללה שהתנפחה יוצאת משימוש.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 21","id":78},{"t":"תקנות - מטיסן","q":"מהם שלושת סוגי \"אזורי הטיסה\" המוגדרים בפמ\"ת ובנוטאם?","o":["אזור צבאי, אזרחי ומעורב","אזור פיקוח, אזור מנחת ואזור אימונים","אזור ירוק, צהוב ואדום","אזור אסור לטיסה, אזור מוגבל לטיסה, אזור מסוכן לטיסה"],"a":3,"e":"ההגדרות: אזור אסור (טיסה אסורה), אזור מוגבל (טיסה מוגבלת לתנאים מוגדרים), אזור מסוכן (ייתכנו פעילויות מסוכנות בפרקי זמן מוגדרים, פורסם בפמ\"ת או בנוטאם).","ref":"מצגת רישיון מטיסן - עמוד 4","id":80},{"t":"טכני","q":"מהי לוגיקת חזרה הביתה (RH) ומה יש לוודא בהגדרתה?","o":["מצב חיסכון בסוללה בלבד","חזרה אקראית לנקודה כלשהי","יכולת לתכנן נקודה מראש שאליה הכטב\"ם יטוס וינחת אם לא תהיה תקשורת או בתקלות מסוימות; יש לוודא שהמטיס מזין נקודה בטוחה ושיהיה קו ישיר בינה לבין נתיב הטיסה הצפוי","חזרה לנקודה הגבוהה ביותר באזור"],"a":2,"e":"RH מחזיר את הכטב\"ם לנקודה מתוכננת באובדן תקשורת או בתקלות; יש לוודא נקודה בטוחה וקו ישיר בינה לנתיב הצפוי.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 21","id":79}]);
</script>
<script>EXAMS.push([{"t":"תקנות - מטיס","q":"מהי \"יחידת נת\"א\" לפי ההגדרה?","o":["יחידה לניהול תעבורה אווירית, לרבות יחידה צבאית המספקת שירותי ניהול תעבורה אווירית לתעופה האזרחית","מחלקת הרישוי של רת\"א","מערכת השליטה של הכטב\"ם","יחידת משטרה אווירית"],"a":0,"e":"יחידת נת\"א מוגדרת כיחידה לניהול תעבורה אווירית, כולל יחידה צבאית המספקת שירותים לתעופה האזרחית - הגורם שמאשר הטסות באזורים מסוימים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 6","id":81},{"t":"חישוב","q":"בתרגיל לפי שיטת החישוב במצגת: גובה הקרקע 61 מטר (כ-200 רגל ASL), ונתיב בפמ\"ת בגובה 600 רגל ASL. נדרשת הפרדה אנכית של 200 רגל. ללא מגבלות אחרות, מה תקרת הטיסה מעל הקרקע?","o":["400 רגל AGL","600 רגל AGL","100 רגל ASL","200 רגל AGL (400 רגל ASL)"],"a":3,"e":"תקרת הטיסה היא 600 פחות 200 = 400 רגל ASL. מחסרים 200 רגל של גובה הקרקע ומקבלים 200 רגל AGL (כ-61 מטר). תוצאה זו נמוכה גם ממגבלת 300 רגל AGL המופיעה בתנאי ההפרדות המופחתות וממגבלת 100 מטר הכללית.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 27","id":88},{"t":"תקנות - מטיס","q":"מי הוא \"בעלים רשום\" לפי תקנות כטב\"ם קטן?","o":["כל מי שרכש כטב\"ם","מי שנרשם בתעודת הרישום בתור בעלים של כטב\"ם קטן","המטיס בלבד, גם אם אינו הבעלים","היצרן"],"a":1,"e":"בעלים רשום הוא מי שנרשם בתעודת הרישום כבעלים של הכטב\"ם הקטן, ועליו חלות חובות כגון מתן רשות להפעלה והודעה על שינויים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 6","id":82},{"t":"מטאורולוגיה","q":"כיצד מוגדרות רוח גב ורוח אף ביחס לכיוון הטיסה?","o":["רוח גב ניצבת לכיוון הטיסה ורוח אף תמיד אנכית","רוח גב נושבת עם כיוון הטיסה ורוח אף נגד כיוון הטיסה","רוח גב קיימת רק על הקרקע","אין הבדל ביניהן"],"a":1,"e":"לפי מצגת המטיס: רוח גב היא רוח עם כיוון הטיסה, ורוח אף היא רוח נגד כיוון הטיסה. יש להתחשב ברוח בתכנון זמני הטיסה ובמגבלות היצרן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 25","id":92},{"t":"תקנות - מטיס","q":"מה כלול בהגדרת \"תשתית\"?","o":["רק קווי מתח גבוה","רק בניינים מעל 4 קומות","אזור מאוכלס, וכל אתר שפגיעת כטב\"ם בו עלולה לסכן חיים או רכוש של אדם","רק שדות תעופה"],"a":2,"e":"תשתית מוגדרת כאזור מאוכלס וכן כל אתר שפגיעת כטב\"ם בו עלולה לסכן חיים או רכוש.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 6","id":83},{"t":"מטאורולוגיה","q":"מהו סטראטוס ומהו אלטוסטראטוס?","o":["סטראטוס - ענן שכבתי שיכול במקרים מסוימים ליצור טפטוף; אלטוסטראטוס - ענן שכבתי בינוני שבדרך כלל לא מוריד גשם","סטראטוס - ענן גבוה; אלטוסטראטוס - ענן נמוך","שניהם ענני גשם כבד","שניהם ענני סופה"],"a":0,"e":"סטראטוס שכבתי נמוך עם אפשרות לטפטוף; אלטוסטראטוס שכבתי בינוני שברוב המקרים לא מוריד גשם.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 26","id":93},{"t":"תקנות - מטיס","q":"באילו תנאים ניתן להטיס באזור אסור לטיסה או באזור מסוכן לטיסה?","o":["באישור הבעלים הרשום בלבד","באישור התצפיתן","אף פעם, אין יוצא מן הכלל","רק אם מנהל רת\"א אישר את ההפעלה הנדרשת"],"a":3,"e":"באזור אסור או מסוכן לטיסה אין להטיס אלא אם מנהל רת\"א אישר את ההפעלה. באזור מוגבל - לפי התנאים שנקבעו לו או באישור הגורם השולט, הגורם המשתמש ויחידת הנת\"א.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 15","id":84},{"t":"טכני","q":"מה נדרש לעניין כיוון מצפני לפני יום טיסות, וממה יש להיזהר?","o":["אין צורך בכיול","נדרש כיול מצפני בתחילת יום טיסות או לפי הוראות היצרן; סביבת מתח גבוהה יכולה להשפיע על הכיוון המצפני ולגרום להטסה לא בטוחה - יש להתרחק מקווי מתח גבוה","כיול פעם בשנה בלבד","יש לכייל רק אחרי החלפת סוללה"],"a":1,"e":"כיול מצפני בתחילת יום טיסות או לפי הוראות היצרן; קווי מתח גבוה מפריעים למצפן ועלולים לגרום להטסה לא בטוחה.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 21","id":94},{"t":"תקנות - מטיס","q":"מה הדין לגבי הטסה בניגוד לנוטאם שפרסם הגבלות על טיסה באזורים מסוימים?","o":["אין להטיס בניגוד לנוטאם, אלא לפי אותן ההגבלות או באישור הגורם השולט באזור, הגורם המשתמש בו ויחידת הנת\"א המתאימה, כפי שפורסם בנוטאם","מותר בגובה נמוך","מותר באזורים לא מאוכלסים","נוטאם אינו מחייב כטב\"מים"],"a":0,"e":"הטסה בניגוד לנוטאם מותרת רק לפי ההגבלות עצמן או באישור הגורם השולט, הגורם המשתמש ויחידת הנת\"א, כפי שפורסם בנוטאם.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 15","id":85},{"t":"טכני","q":"מה נכון לגבי המהירות הקרקעית (Ground Speed) לעומת המהירות האווירית?","o":["מהירות קרקעית רלוונטית רק למסוקים","הן תמיד זהות","המהירות הקרקעית מוצגת בדרך כלל על עמדת השליטה ומשמשת לחישוב זמן טיסה בין נקודות; עוצמת וכיוון הרוח משפיעים עליה. המהירות האווירית (מתוקנת/אמתית) מתארת את מהירות הכטב\"ם בתוך גוש האוויר וקריטית לעילוי ולהזדקרות, בעיקר בכנף קבועה","המהירות האווירית משמשת לחישוב זמן הגעה"],"a":2,"e":"מהירות קרקעית (מושפעת מרוח) לחישוב זמני טיסה; מהירות אווירית לעילוי והזדקרות, רלוונטית בעיקר לכנף קבועה ולא לרחפן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 22","id":95},{"t":"תקנות - מטיס","q":"לגבי גובה 60 מטרים בפמ\"ת: מתי גובה ההטסה המרבי של כטב\"ם קטן ירד מ-100 ל-60 מטרים?","o":["בכל יום שישי","כאשר נקבע בפמ\"ת גובה 60 מטר לאותו מקום, בהסכמת מי שמפקד חיל האוויר הסמיכו","בכל אזור מאוכלס אוטומטית","בלילה בלבד"],"a":1,"e":"לפי המצגת, קביעה בפמ\"ת ושינויה טעונים את הסכמת מי שמפקד חיל האוויר הסמיכו; באותו מקום אין לעבור 60 מטר מעל פני השטח.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 16","id":86},{"t":"טכני","q":"מה נכון לגבי תאורות הרחפן?","o":["אדום מאחור וירוק מקדימה","תאורה לבנה אחת בלבד","אין חשיבות לצבעי התאורות","למרבית הרחפנים 2 תאורות אדומות בקידמת הרחפן ו-2 תאורות ירוקות בחלק האחורי, שבאמצעותן ניתן לדעת מה כיוון הטיסה בלילה"],"a":3,"e":"אדום בקדמה וירוק באחור - כך מזהים בלילה את כיוון הטיסה של הרחפן.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 22","id":96},{"t":"תקנות - מטיס","q":"מה עושים אם רוצים פטור מתקנה שלא מופיעה ברשימת התקנות שמהן ניתן לבקש הרשאה להפעלה מיוחדת?","o":["משנים את מספר הרישום","לא ניתן לבקש פטור בכלל","מבקשים פטור לפי סעיף 165 לחוק הטיס","מבקשים אישור מהמשטרה"],"a":2,"e":"פטור מתקנה שלא ברשימה מתבקש לפי סעיף 165 לחוק הטיס; את ההרשאה להפעלה חריגה מהתקנות שברשימה מבקשים דרך אתר הרישום והבחינה עם ניהול סיכונים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 17","id":87},{"t":"תקנות - מטיסן","q":"מהו \"טיסן גדול\" לפי ההגדרה?","o":["טיסן שמסתו בהמראה גדולה מ-25 קילוגרם, כולל כל דבר שהוא נושא ומחובר אליו","טיסן מעל 150 ק\"ג","טיסן עם מצלמה","כל טיסן מסחרי"],"a":0,"e":"טיסן גדול מוגדר לפי מסה בהמראה הגדולה מ-25 ק\"ג; הפעלתו מהווה \"הפעלת טיסן בחריגה\" ודורשת הסדרה מיוחדת.","ref":"מצגת רישיון מטיסן - עמוד 3","id":89},{"t":"תקנות - מטיסן","q":"מה ההבדל בין רישיון מטיסן לרישיון מטיס?","o":["אין הבדל","רישיון מטיסן מאפשר הטסת טיסן (ספורט ופנאי בלבד); רישיון מטיס מאפשר הטסת כטב\"ם (הפעלה מסחרית)","רישיון מטיסן יקר יותר","רישיון מטיס הוא לטיסה בלילה בלבד"],"a":1,"e":"מטיסן - ספורט ופנאי בלבד; מטיס - הפעלה מסחרית של כטב\"ם על בסיס תקנות כטב\"ם קטן.","ref":"מצגת רישיון מטיסן - עמוד 3","id":90},{"t":"תקנות - מטיסן","q":"האם מותר להטיס טיסן מעל כלי רכב בתנועה?","o":["כן, בכבישים מהירים בלבד","כן, אם הרכב פרטי","לא ניתן להטיס מעל כלי רכב בתנועה בין אם הוא ממונע ובין שאינו ממונע","כן, בגובה מעל 30 מטר"],"a":2,"e":"איסור גורף על הטסה מעל כלי רכב בתנועה, ממונע או לא. יוצא מן הכלל היחיד: טיסן זעיר בעמידה בתנאים, ובלי שהייה מעל הרכב.","ref":"מצגת רישיון מטיסן - עמוד 12","id":91},{"t":"תקנות - מטיסן","q":"מהן הפעולות הנדרשות לפני הפעלת טיסן?","o":["רק טעינת סוללה מלאה","הערכת הסביבה (תנאי מז\"א, בדיקת מרחב אווירי ומכשולים), תדרוך משתתפי ההפעלה, ובדיקת תקינות רכיבי הטיסן ועמדת השליטה","רק בדיקת מזג אוויר באפליקציה","רק רישום ביומן"],"a":1,"e":"לפני הפעלה: הערכת סביבה הכוללת מזג אוויר, מרחב אווירי ומכשולים; תדרוך משתתפים; בדיקת תקינות הטיסן ועמדת השליטה.","ref":"מצגת רישיון מטיסן - עמוד 14","id":98},{"t":"תקנות - מטיס","q":"מהי \"הרשאה להפעלה מיוחדת\" לפי ההגדרה בתקנות?","o":["אישור יבוא של כטב\"ם","אישור להטסה בלילה בלבד","הפעלה של מערכת כטב\"ם קטן שלא לפי התקנות, עבור התקנות הספציפיות שמהן ניתן לבקש (כגון קשר עין ישיר, הפעלה מעל אדם או תשתית, מגבלות כלליות ועוד)","רישיון מטיס חדש"],"a":2,"e":"הרשאה להפעלה מיוחדת מאפשרת הפעלה שלא לפי תקנות מסוימות שברשימה (למשל תקנות 27, 28, 29, 32, 35), ומתבקשת באתר הרישום והבחינה עם ניהול סיכונים.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 4","id":99},{"t":"תקנות - מטיס","q":"מהו \"מיליבר\" ומהם AGL ו-ASL?","o":["מיליבר - יחידת טמפרטורה; AGL מעל פני הים; ASL מעל פני השטח","שלושתם מונחי מטאורולוגיה בלבד","מיליבר - יחידת מהירות; AGL ו-ASL סוגי רישיונות","מיליבר - יחידה למדידת לחץ; AGL - גובה מעל פני השטח (מוצג במערכת השליטה); ASL - גובה מעל פני הים (שפה משותפת עם בקרה אווירית, מוצג במפות ובאפליקציות של רת\"א)"],"a":3,"e":"מיליבר הוא יחידת לחץ; AGL מודד מגובה הקרקע המקומי, ו-ASL מפני הים - ההבחנה ביניהם קריטית בקריאת מפות פמ\"ת ובשאלות חישוב.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 25","id":100},{"t":"טכני","q":"מהם \"עילוי\" ו\"מרכז כובד\"?","o":["עילוי - סך הכוחות האווירודינמיים על הכנף המתנגדים לכבידה ומאפשרים לגופים כבדים מהאוויר לעוף; מרכז כובד - הנקודה הממוצעת של מסת הכטב\"ם, החשובה להערכת ביצועים ויציבות","עילוי - דחף המנוע; מרכז כובד - מיקום הסוללה","שניהם שמות של מדידים","עילוי - משקל הכטב\"ם; מרכז כובד - מהירות מרבית"],"a":0,"e":"עילוי מנוגד לכבידה ומתחזק עם מהירות וצפיפות אוויר; מרכז כובד קובע יציבות, ומרכז כובד אחורי עלול להביא להזדקרות.","ref":"מצגת רישיון מטיס (מסחרי) - עמוד 24","id":97}]);
</script>
<script>

}

function home(){
  const p=load();
  let rows=EXAMS.map((ex,i)=>{
    const r=p[i];
    const st=r?`<span class="done">הושלם - הציון הטוב ביותר ${r.score}/20 (${Math.round(r.score/20*100)}%)</span>`:`<span class="st">טרם בוצע</span>`;
    return `<button class="exam-row" onclick="startExam(${i})"><span><b>מבחן ${i+1}</b><br>${st}</span><span>◀</span></button>`;
  }).join('');
  const install=deferredPrompt
    ?`<div class="card"><button class="btn-main" onclick="doInstall()">התקנת האפליקציה במכשיר</button><div class="install-note">לחצו להוספת קיצור למסך הבית - זהו קישור ההתקנה היחיד</div></div>`
    :`<div class="card"><button class="btn-main" onclick="doInstall()">התקנת האפליקציה במכשיר</button><div class="install-note" id="inst-note">לחצו להוראות התקנה - זהו קישור ההתקנה היחיד</div></div>`;
  app.innerHTML=`<h1>הכנה למבחן רת"א</h1><div class="sub">כטב"ם קטן וטיסן - 5 מבחנים, 20 שאלות בכל מבחן</div>${install}<div class="sub">תרגול עצמאי על בסיס שתי המצגות שצורפו, ולא מאגר שאלות רשמי או הנחיות לטיסה בפועל. מגבלות והוראות עדכניות יש לבדוק במקורות הרשמיים.</div>${rows}
  <button class="btn-ghost" onclick="resetAll()">איפוס תוצאות</button>`;
  scrollTopNow();
}
function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()})}
  else{
    const n=document.getElementById('inst-note');
    if(n)n.textContent='בכרום בנייד: תפריט (⋮) > "הוספה למסך הבית" / "התקנת אפליקציה". נדרש טעינה אחת מהקישור הזה.';
  }
}
function resetAll(){if(confirm('לאפס את כל התוצאות?')){localStorage.removeItem(LS);render()}}

function startExam(i){state={view:'exam',exam:i,q:0,answers:new Array(20).fill(-1)};render()}
function exam(){
  const ex=EXAMS[state.exam],n=state.q,q=ex[n],ans=state.answers;
  const done=ans.filter(a=>a>=0).length;
  const opts=q.o.map((o,i)=>`<button class="opt ${ans[n]===i?'sel':''}" onclick="pick(${i})">${['א','ב','ג','ד'][i]}. ${o}</button>`).join('');
  app.innerHTML=`
  <div class="rev-head"><span class="pill">מבחן ${state.exam+1} מתוך 5</span><span class="pill">${q.t}</span></div>
  <div class="prog"><div style="width:${(n+1)/20*100}%"></div></div>
  <div class="card"><div class="pill">שאלה ${n+1} מתוך 20 - נענו ${done}</div>
  <div class="qtext">${q.q}</div>${opts}</div>
  <div class="nav">
    <button onclick="go(-1)" ${n===0?'disabled':''}>הקודם</button>
    ${n<19?`<button onclick="go(1)" ${ans[n]<0?'disabled':''}>הבא</button>`:`<button onclick="finish()" style="background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600">סיום מבחן</button>`}
  </div>
  <button class="btn-ghost" onclick="quitExam()">יציאה מהמבחן</button>`;
  scrollTopNow();
}
function pick(i){state.answers[state.q]=i;render()}
function go(d){state.q+=d;render()}
function quitExam(){if(confirm('לצאת מהמבחן? ההתקדמות תאבד.')){state={view:'home'};render()}}
function finish(){
  const missing=state.answers.filter(a=>a<0).length;
  if(missing){alert(`נותרו ${missing} שאלות ללא מענה.`);return;}
  const ex=EXAMS[state.exam];
  let sc=0;state.answers.forEach((a,i)=>{if(a===ex[i].a)sc++});
  const p=load();
  if(!p[state.exam]||sc>p[state.exam].score){p[state.exam]={score:sc};save(p)}
  state.view='score';state.score=sc;render();
}
function score(){
  const sc=state.score,pct=Math.round(sc/20*100);
  const pass=pct>=80;
  app.innerHTML=`<h1>תוצאות מבחן ${state.exam+1}</h1><div class="sub">${pass?'תרגול מצוין!':'מומלץ לעבור על ההסברים ולתרגל שוב'}</div>
  <div class="card center"><div class="score-big" style="color:${pass?'var(--ok)':'var(--bad)'}">${sc}/20</div><div>${pct}%</div></div>
  <button class="btn-main" onclick="state.view='review';render()">צפייה בכל השאלות והתשובות</button>
  <div style="height:10px"></div>
  <button class="btn-ghost" onclick="state={view:'home'};render()">חזרה למסך הבית</button>`;
  scrollTopNow();
}
function review(){
  const ex=EXAMS[state.exam];
  const items=ex.map((q,i)=>{
    const a=state.answers[i],ok=a===q.a;
    const opts=q.o.map((o,j)=>{
      let c='opt';if(j===q.a)c+=' correct';else if(j===a)c+=' wrong';
      return `<div class="${c}" style="cursor:default">${['א','ב','ג','ד'][j]}. ${o}</div>`;
    }).join('');
    return `<div class="card"><div class="rev-head"><span class="pill">שאלה ${i+1} - ${q.t}</span><span class="mark ${ok?'ok':'bad'}">${ok?'נכון':'שגוי'}</span></div>
    <div class="qtext" style="font-size:15.5px">${q.q}</div>${opts}
    <div class="exp"><b>התשובה שלך:</b> ${a<0?'ללא מענה':q.o[a]}<br><b>התשובה הנכונה:</b> ${q.o[q.a]}<br><br>${q.e}<br><small>${q.ref}</small></div></div>`;
  }).join('');
  app.innerHTML=`<h1>סקירת מבחן ${state.exam+1}</h1><div class="sub">הציון שלך: ${state.score}/20</div>${items}
  <button class="btn-ghost" onclick="state={view:'home'};render()">חזרה למסך הבית</button>`;
  scrollTopNow();
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
