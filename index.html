<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2942">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>הכנה למבחן רת"א - כטב"ם קטן וטיסן</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0f2942;--card:#16344f;--ink:#eef4fa;--dim:#a8bdd0;--acc:#2ea3f2;--ok:#2fbf71;--bad:#e5484d;--line:#274a6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:16px}
  .btn-main{background:var(--acc);color:#fff;padding:14px;width:100%;font-weight:600}
  .btn-ghost{background:transparent;color:var(--dim);padding:10px;width:100%;font-size:14px}
  .exam-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;width:100%;color:var(--ink);text-align:right}
  .exam-row .st{font-size:13px;color:var(--dim)}
  .exam-row .done{color:var(--ok);font-weight:600}
  .pill{display:inline-block;background:#0b1f33;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .qtext{font-size:17px;line-height:1.5;margin-bottom:14px}
  .opt{display:block;width:100%;text-align:right;background:#0b1f33;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:15px;line-height:1.45}
  .opt.sel{border-color:var(--acc);background:#123a5c}
  .opt.correct{border-color:var(--ok);background:#0e3b2a}
  .opt.wrong{border-color:var(--bad);background:#42131a}
  .nav{display:flex;gap:10px;margin-top:6px}
  .nav button{flex:1;padding:12px;background:#0b1f33;color:var(--ink);border:1px solid var(--line)}
  .nav button:disabled{opacity:.35}
  .prog{height:6px;background:#0b1f33;border-radius:3px;overflow:hidden;margin:10px 0 14px}
  .prog>div{height:100%;background:var(--acc);transition:width .2s}
  .score-big{font-size:52px;font-weight:700;text-align:center;margin:8px 0}
  .center{text-align:center}
  .exp{background:#0b1f33;border-right:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--dim);line-height:1.5;margin-top:8px}
  .rev-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .mark{font-size:12px;font-weight:700}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  .install-note{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="exam1.js"></script>
<script src="exam2.js"></script>
<script src="exam3.js"></script>
<script src="exam4.js"></script>
<script src="exam5.js"></script>
<script>
const LS='rtaa-progress-v1';
const app=document.getElementById('app');
let state={view:'home'};
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function save(p){localStorage.setItem(LS,JSON.stringify(p))}
function top(){window.scrollTo(0,0)}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;render()});

function render(){
  if(state.view==='home')return home();
  if(state.view==='exam')return exam();
  if(state.view==='score')return score();
  if(state.view==='review')return review();
}

function home(){
  const p=load();
  let rows=EXAMS.map((ex,i)=>{
    const r=p[i];
    const st=r?`<span class="done">הושלם - ${r.score}/20 (${Math.round(r.score/20*100)}%)</span>`:`<span class="st">טרם בוצע</span>`;
    return `<button class="exam-row" onclick="startExam(${i})"><span><b>מבחן ${i+1}</b><br>${st}</span><span>◀</span></button>`;
  }).join('');
  const install=deferredPrompt
    ?`<div class="card"><button class="btn-main" onclick="doInstall()">התקנת האפליקציה במכשיר</button><div class="install-note">לחצו להוספת קיצור למסך הבית - זהו קישור ההתקנה היחיד</div></div>`
    :`<div class="card"><button class="btn-main" onclick="doInstall()">התקנת האפליקציה במכשיר</button><div class="install-note" id="inst-note">לחצו להוראות התקנה - זהו קישור ההתקנה היחיד</div></div>`;
  app.innerHTML=`<h1>הכנה למבחן רת"א</h1><div class="sub">כטב"ם קטן וטיסן - 5 מבחנים, 20 שאלות בכל מבחן</div>${install}${rows}
  <button class="btn-ghost" onclick="resetAll()">איפוס תוצאות</button>`;
  top();
}
function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()})}
  else{
    const n=document.getElementById('inst-note');
    if(n)n.textContent='בכרום בנייד: תפריט (⋮) > "הוספה למסך הבית" / "התקנת אפליקציה". נדרש טעינה אחת מהקישור הזה.';
  }
}
function resetAll(){if(confirm('לאפס את כל התוצאות?')){localStorage.removeItem(LS);render()}}

function startExam(i){state={view:'exam',exam:i,q:0,answers:new Array(20).fill(-1)};render()}
function exam(){
  const ex=EXAMS[state.exam],n=state.q,q=ex[n],ans=state.answers;
  const done=ans.filter(a=>a>=0).length;
  const opts=q.o.map((o,i)=>`<button class="opt ${ans[n]===i?'sel':''}" onclick="pick(${i})">${['א','ב','ג','ד'][i]}. ${o}</button>`).join('');
  app.innerHTML=`
  <div class="rev-head"><span class="pill">מבחן ${state.exam+1} מתוך 5</span><span class="pill">${q.t}</span></div>
  <div class="prog"><div style="width:${(n+1)/20*100}%"></div></div>
  <div class="card"><div class="pill">שאלה ${n+1} מתוך 20 - נענו ${done}</div>
  <div class="qtext">${q.q}</div>${opts}</div>
  <div class="nav">
    <button onclick="go(-1)" ${n===0?'disabled':''}>הקודם</button>
    ${n<19?`<button onclick="go(1)" ${ans[n]<0?'disabled':''}>הבא</button>`:`<button onclick="finish()" style="background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600">סיום מבחן</button>`}
  </div>
  <button class="btn-ghost" onclick="quitExam()">יציאה מהמבחן</button>`;
  top();
}
function pick(i){state.answers[state.q]=i;render()}
function go(d){state.q+=d;render()}
function quitExam(){if(confirm('לצאת מהמבחן? ההתקדמות תאבד.')){state={view:'home'};render()}}
function finish(){
  const missing=state.answers.filter(a=>a<0).length;
  if(missing&&!confirm(`נותרו ${missing} שאלות ללא מענה. לסיים בכל זאת?`))return;
  const ex=EXAMS[state.exam];
  let sc=0;state.answers.forEach((a,i)=>{if(a===ex[i].a)sc++});
  const p=load();
  if(!p[state.exam]||sc>p[state.exam].score){p[state.exam]={score:sc};save(p)}
  state.view='score';state.score=sc;render();
}
function score(){
  const sc=state.score,pct=Math.round(sc/20*100);
  const pass=pct>=80;
  app.innerHTML=`<h1>תוצאות מבחן ${state.exam+1}</h1><div class="sub">${pass?'כל הכבוד, ציון עובר!':'שווה לחזור על החומר ולנסות שוב'}</div>
  <div class="card center"><div class="score-big" style="color:${pass?'var(--ok)':'var(--bad)'}">${sc}/20</div><div>${pct}%</div></div>
  <button class="btn-main" onclick="state.view='review';render()">צפייה בכל השאלות והתשובות</button>
  <div style="height:10px"></div>
  <button class="btn-ghost" onclick="state={view:'home'};render()">חזרה למסך הבית</button>`;
  top();
}
function review(){
  const ex=EXAMS[state.exam];
  const items=ex.map((q,i)=>{
    const a=state.answers[i],ok=a===q.a;
    const opts=q.o.map((o,j)=>{
      let c='opt';if(j===q.a)c+=' correct';else if(j===a)c+=' wrong';
      return `<div class="${c}" style="cursor:default">${['א','ב','ג','ד'][j]}. ${o}</div>`;
    }).join('');
    return `<div class="card"><div class="rev-head"><span class="pill">שאלה ${i+1} - ${q.t}</span><span class="mark ${ok?'ok':'bad'}">${ok?'נכון':'שגוי'}</span></div>
    <div class="qtext" style="font-size:15.5px">${q.q}</div>${opts}
    <div class="exp">${q.e}</div></div>`;
  }).join('');
  app.innerHTML=`<h1>סקירת מבחן ${state.exam+1}</h1><div class="sub">הציון שלך: ${state.score}/20</div>${items}
  <button class="btn-ghost" onclick="state={view:'home'};render()">חזרה למסך הבית</button>`;
  top();
}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
